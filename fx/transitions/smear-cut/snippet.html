<!-- smear-cut: chép bộ lọc SVG này vào trong #root (một lần cho cả dự án). -->
<svg width="0" height="0" style="position: absolute" aria-hidden="true">
  <defs>
    <filter id="ms-smear" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="0 0" edgeMode="duplicate" />
    </filter>
  </defs>
</svg>
<script>
  // Sau khi đã có tl và đã nạp fx/transitions/smear-cut/snippet.js. from/to là hai shot hai bên điểm cắt.
  MotionFx["smear-cut"].attach(tl, {
    from: document.getElementById("s3"),
    to: document.getElementById("s4"),
    blur: document.querySelector("#ms-smear feGaussianBlur"),
    filterUrl: "url(#ms-smear)",
  }, { at: 6.4, fps: 30, frames: 2, dir: "right", stretch: 1.35, blur: 18, shift: 60 });
</script>
